services:
  api:
    build: .
    profiles: ["core"]
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    init: true
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    profiles: ["database"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api
    ports:
      - "5432:5432"
    volumes:
      - api-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  api-pg-data:
